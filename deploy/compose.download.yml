# B server. DOWNLOAD_PRIVATE_IP must be an IP actually assigned on B.
name: d1apk-download
services:
  app:
    build: ..
    image: d1apk:local
    restart: unless-stopped
    env_file: ../.env
    environment:
      SERVER_ROLE: download
      REMOTE_STORAGE_URL: ""
      ADMIN_EMAIL: ""
      ADMIN_PASSWORD: ""
      DATABASE_URL: ${DATABASE_URL:?Set private shared PostgreSQL URL}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.88.0/24,10.42.0.10/32}
    # For A -> B storage transfer only. Never bind this port to 0.0.0.0.
    ports: ["${DOWNLOAD_PRIVATE_IP:?Set B private IP}:8088:8088"]
    volumes: [download-data:/app/data]
    stop_grace_period: 45s
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    networks: [private]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app: {condition: service_healthy}
    networks: [private]
networks:
  private:
    ipam:
      config: [{subnet: 172.30.88.0/24}]
volumes:
  download-data:
  caddy-data:
  caddy-config:
