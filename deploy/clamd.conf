Foreground yes
User clamav
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /tmp/clamd.sock
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
LogTime yes
LogClean no
MaxThreads 4
MaxQueue 24
StreamMaxLength 2048M
MaxFileSize 2048M
MaxScanSize 2048M
MaxScanTime 300000
ReadTimeout 600
CommandReadTimeout 60
AlertExceedsMax yes
ScanArchive yes
ScanPE yes
