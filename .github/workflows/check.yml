name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres-test-only
          POSTGRES_USER: d1test
          POSTGRES_DB: d1test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U d1test -d d1test" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: go test ./...
      - run: ./scripts/check.sh
        env:
          TEST_DATABASE_URL: postgres://d1test:postgres-test-only@localhost:5432/d1test?sslmode=disable
      - run: |
          cp .env.example .env
          docker compose --env-file .env.example config --quiet
        env:
          POSTGRES_PASSWORD: ci-config-only
          ACME_EMAIL: ci@example.com
      - run: docker build -t d1apk:test .
