<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <title>Account not found</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #f2f7ff; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; color: #21334e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 48px 24px; overflow-x: hidden; background: radial-gradient(ellipse at 16% 10%, #fff 0, transparent 42%), radial-gradient(ellipse at 88% 88%, #dbeaff 0, transparent 48%), #f2f7ff; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .35; background-image: linear-gradient(#b7ccec33 1px, transparent 1px), linear-gradient(90deg, #b7ccec33 1px, transparent 1px); background-size: 64px 64px; mask-image: radial-gradient(ellipse, #000, transparent 74%); }
    .scene { width: min(100%, 940px); position: relative; isolation: isolate; }
    .scene::before, .scene::after { content: ""; position: absolute; border-radius: 34px; z-index: -1; border: 1px solid #ffffff; }
    .scene::before { inset: -13px 25px 13px -13px; background: #e3eeff; transform: rotate(-3deg); }
    .scene::after { inset: 17px -13px -16px 24px; background: #ffffff99; transform: rotate(2deg); box-shadow: 0 24px 80px #35629d0c; }
    .card { position: relative; display: grid; grid-template-columns: .95fr 1fr; align-items: center; gap: 50px; padding: 70px 64px; background: #fffffff2; border: 1px solid #fff; border-radius: 30px; box-shadow: 0 28px 70px #325c9210, 0 2px 10px #325c9205; }
    .illustration { position: relative; min-height: 280px; display: grid; place-items: center; }
    .halo { position: absolute; width: 276px; height: 276px; border-radius: 50%; background: linear-gradient(145deg, #f4f8ff, #e3eeff); border: 1px solid #dce9fc; }
    .halo::before { content: ""; position: absolute; inset: -22px; border-radius: 50%; border: 1px dashed #d3e2f7; }
    .number { position: absolute; top: 7px; left: 50%; transform: translateX(-50%); font-size: 128px; line-height: 1.2; font-weight: 800; letter-spacing: -10px; color: #c5d9f6; user-select: none; }
    .art { position: relative; width: 240px; height: 222px; margin-top: 80px; filter: drop-shadow(0 18px 20px #7797c629); }
    .badge { display: inline-flex; align-items: center; gap: 7px; margin: 0 0 20px; padding: 7px 10px; color: #466b9d; background: #eff5fe; border: 1px solid #e0ebfc; border-radius: 7px; font-size: 10px; line-height: 1; font-weight: 700; letter-spacing: 1.35px; text-transform: uppercase; }
    .badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #6b97d3; }
    h1 { margin: 0 0 18px; max-width: 320px; color: #20334e; font-size: clamp(30px, 3.8vw, 40px); line-height: 1.16; letter-spacing: -1.25px; font-weight: 730; }
    .description { max-width: 300px; margin: 0; color: #5c6c82; font-size: 15px; line-height: 1.8; }
    .support { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 13px 19px; margin-top: 28px; border: 1px solid #376cc1; border-radius: 10px; background: #3972ca; box-shadow: 0 5px 12px #3972ca20; color: #fff; font-size: 13px; font-weight: 650; text-decoration: none; transition: background .18s, box-shadow .18s; }
    .support:hover { background: #2e62b4; box-shadow: 0 6px 14px #3972ca30; }
    .support:focus-visible { outline: 3px solid #a5c8ff; outline-offset: 4px; }
    .support svg { width: 16px; height: 16px; }
    .footer { display: flex; align-items: center; gap: 10px; margin: 29px 0 0; color: #718095; font-size: 10px; line-height: 1.5; letter-spacing: 1.1px; text-transform: uppercase; }
    .footer::before { content: ""; width: 24px; height: 1px; background: #c8d8ee; }
    @media (max-width: 700px) { body { padding: 42px 24px; } .scene { max-width: 440px; } .scene::before { inset: -10px 14px 12px -8px; transform: rotate(-2deg); } .scene::after { inset: 14px -8px -12px 14px; transform: rotate(1.5deg); } .card { grid-template-columns: 1fr; gap: 30px; padding: 42px 28px; text-align: center; border-radius: 25px; } .illustration { min-height: 245px; } .halo { width: 230px; height: 230px; } .halo::before { inset: -16px; } .number { top: -5px; font-size: 112px; } .art { width: 205px; height: 190px; margin-top: 72px; } .badge { margin-bottom: 16px; } h1 { max-width: none; font-size: 30px; letter-spacing: -.8px; } .description { margin-inline: auto; font-size: 14px; } .support { margin-top: 24px; } .footer { justify-content: center; margin-top: 25px; } }
    @media (max-width: 350px) { body { padding-inline: 18px; } .card { padding: 36px 22px; } h1 { font-size: 27px; } }
    @media (prefers-reduced-motion: reduce) { .support { transition: none; } }
  </style>
</head>
<body>
  <main class="scene">
    <div class="card">
      <div class="illustration" aria-hidden="true">
        <div class="halo"></div>
        <div class="number">404</div>
        <svg class="art" viewBox="0 0 240 222" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="paper" x1="52" y1="38" x2="184" y2="192" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#edf4ff"/></linearGradient>
            <linearGradient id="lens" x1="149" y1="115" x2="204" y2="174" gradientUnits="userSpaceOnUse"><stop stop-color="#edf5ff"/><stop offset="1" stop-color="#bad4f8"/></linearGradient>
          </defs>
          <rect x="43" y="41" width="134" height="153" rx="17" transform="rotate(-10 43 41)" fill="#d9e7fb" stroke="#c6d9f4"/>
          <rect x="55" y="33" width="134" height="153" rx="17" fill="url(#paper)" stroke="#d4e2f7"/>
          <path d="M77 55h28" stroke="#c4d7f1" stroke-width="4" stroke-linecap="round"/>
          <circle cx="122" cy="96" r="19" fill="#e7f0fd" stroke="#d1e1f7"/>
          <circle cx="122" cy="91" r="6" fill="#9bbbe5"/>
          <path d="M110 108c1-7 5-11 12-11s11 4 12 11" fill="#9bbbe5"/>
          <path d="M87 137h69M99 151h45" stroke="#cfdef3" stroke-width="4" stroke-linecap="round"/>
          <path d="m190 167 24 24" stroke="#a6c4ed" stroke-width="15" stroke-linecap="round"/>
          <path d="m190 167 24 24" stroke="#729bd4" stroke-width="8" stroke-linecap="round"/>
          <circle cx="171" cy="146" r="34" fill="url(#lens)" stroke="#87ace0" stroke-width="5"/>
          <circle cx="171" cy="146" r="25" fill="#f6faff" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
          <path d="m164 139 14 14m0-14-14 14" stroke="#82a6d7" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M27 103h10m-5-5v10M206 72h8m-4-4v8" stroke="#97b8e4" stroke-width="2" stroke-linecap="round"/>
          <circle cx="34" cy="156" r="3" fill="#aec9ed"/><circle cx="208" cy="109" r="2" fill="#b9d0ee"/>
        </svg>
      </div>
      <div class="content">
        <p class="badge">Error 404</p>
        <h1>Account not found</h1>
        <p class="description">Please contact customer support for assistance.</p>
        {{if .SupportURL}}<a class="support" href="{{.SupportURL}}"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2.5" y="4" width="15" height="12" rx="2.5" stroke="currentColor" stroke-width="1.5"/><path d="m3.5 5 6.5 5 6.5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Contact support</a>{{end}}
        <p class="footer">We couldn't find this account</p>
      </div>
    </div>
  </main>
</body>
</html>
